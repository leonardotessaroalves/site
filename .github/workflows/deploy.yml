name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Generate static site
        run: npm run generate

      - name: Prepare link-check root
        # The app's baseURL ('/site/') makes generated HTML reference
        # root-relative paths like /site/_nuxt/x.js, but nuxt generate
        # writes assets to .output/public/_nuxt/x.js (no /site prefix)
        # since that prefix only exists once GitHub Pages serves the repo.
        # Mirror that URL structure locally so lychee can resolve them.
        run: |
          mkdir -p /tmp/lychee-root
          ln -s "$GITHUB_WORKSPACE/.output/public" /tmp/lychee-root/site

      - name: Check for broken links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --root-dir /tmp/lychee-root
            --accept 200,999
            .output/public
          fail: true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
